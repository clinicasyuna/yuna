name: SLA Push Alerts

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  send-sla-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Validate required secrets
        id: guard
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "[SLA-PUSH] Skip: secret FIREBASE_SERVICE_ACCOUNT_JSON ausente"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_run=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.guard.outputs.should_run == 'true'
        run: npm ci

      - name: Send SLA push alerts
        if: steps.guard.outputs.should_run == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          YUNA_ADMIN_URL: ${{ secrets.YUNA_ADMIN_URL }}
        run: node scripts/send-sla-push-alerts.js
